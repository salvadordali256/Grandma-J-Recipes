<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Shared recipe collection from Grandma Pauline's community">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta http-equiv="X-Frame-Options" content="DENY">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://grandma-recipes-api.onrender.com; object-src 'none'; base-uri 'self'; form-action 'self';">
    <title>Shared Collection - Grandma Pauline's Recipes</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="header">
        <div class="container">
            <h1 class="site-title">Grandma Pauline's Recipes</h1>
            <p class="site-subtitle">Shared Collection</p>
        </div>
    </header>

    <nav class="nav">
        <div class="container">
            <div class="recipe-nav">
                <a href="index.html" class="back-btn">← Back to Main Site</a>
            </div>
        </div>
    </nav>

    <main class="main">
        <div class="container">
            <section id="collectionView" class="collection-view">
                <div class="loading">Loading collection...</div>
            </section>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <p>&copy; Grandma Pauline's Recipe Collection</p>
            <p class="footer-note">Sharing family favorites together.</p>
        </div>
    </footer>

    <script src="config.js"></script>
    <script src="collections-service.js"></script>
    <script src="accessibility.js"></script>
    <script src="collection-view.js"></script>
</body>
</html>
